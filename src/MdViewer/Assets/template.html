<!DOCTYPE html>
<html lang="ja" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light dark">
<base href="{{BASE}}">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://assets.mdviewer/style.css">
<link rel="stylesheet" href="https://assets.mdviewer/vendor/highlight-github.min.css" id="hljs-light">
<link rel="stylesheet" href="https://assets.mdviewer/vendor/highlight-github-dark.min.css" id="hljs-dark" disabled>
<link rel="stylesheet" href="https://assets.mdviewer/vendor/katex.min.css">
<script>
/* highlight.js のテーマ CSS を初期テーマに合わせて即時切替し、
   ダーク時のトークン色フラッシュを防ぐ（後続の切替は viewer.js が担当）。 */
(function () {
  try {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var light = document.getElementById('hljs-light');
    var darkCss = document.getElementById('hljs-dark');
    if (light) light.disabled = dark;
    if (darkCss) darkCss.disabled = !dark;
  } catch (err) { /* 失敗しても致命的ではない */ }
})();
</script>
<script src="https://assets.mdviewer/vendor/highlight.min.js"></script>
<script src="https://assets.mdviewer/vendor/mermaid.min.js"></script>
<script src="https://assets.mdviewer/vendor/katex.min.js"></script>
<script src="https://assets.mdviewer/vendor/contrib/auto-render.min.js"></script>
</head>
<body>

<button id="toc-toggle" class="toc-toggle" type="button" aria-label="目次の表示切替" title="目次の表示切替">
  <span class="toc-toggle-icon">&#9776;</span>
</button>

<nav id="toc-sidebar" class="toc-sidebar" aria-label="目次">
  <div class="toc-sidebar-header">目次</div>
  <div id="toc-content" class="toc-content"></div>
</nav>

<div id="search-bar" class="search-bar" role="search">
  <input id="search-input" type="text" class="search-input" placeholder="ページ内を検索" autocomplete="off">
  <span id="search-count" class="search-count">0/0</span>
  <button id="search-prev" class="search-btn" type="button" aria-label="前へ" title="前へ (Shift+Enter)">&#8593;</button>
  <button id="search-next" class="search-btn" type="button" aria-label="次へ" title="次へ (Enter)">&#8595;</button>
  <button id="search-close" class="search-btn search-close" type="button" aria-label="閉じる" title="閉じる (Esc)">&#10005;</button>
</div>

<main id="main-content" class="main-content">
  <article class="markdown-body">
{{FRONTMATTER}}
{{BODY}}
  </article>
</main>

{{META}}

<script src="https://assets.mdviewer/viewer.js" defer></script>
</body>
</html>
