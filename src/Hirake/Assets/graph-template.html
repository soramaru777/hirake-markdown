<!DOCTYPE html>
<html lang="ja" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
  /* ---------------------------------------------------------
   * Hirake - graph-template.html 用インラインスタイル
   * ナレッジグラフ・ビュー専用。style.css は読み込まない。
   * 配色は CSS カスタムプロパティで定義し、ライト/ダークは
   * html[data-theme="dark"] で切替える（JS からは色を直接触らない）。
   * --------------------------------------------------------- */
  :root {
    /* ---- ライトテーマ（既定） ---- */
    --graph-bg: #ffffff;
    --graph-node: #4a86c7;
    --graph-node-stroke: #2f5f96;
    --graph-node-hover: #f2a93b;
    --graph-edge: #d1d9e0;
    --graph-edge-hover: #b9c2cc;
    --graph-label: #1f2328;
    --graph-label-muted: #59636e;
    --graph-accent: #d1683c;
    --graph-info-bg: rgba(246, 248, 250, 0.85);
    --graph-info-border: #d1d9e0;
    --graph-info-text: #1f2328;
    --graph-empty-text: #59636e;
  }

  /* ---- ダークテーマ（GitHub Dark 風） ---- */
  html[data-theme="dark"] {
    --graph-bg: #0d1117;
    --graph-node: #58a6ff;
    --graph-node-stroke: #1f6feb;
    --graph-node-hover: #d29922;
    --graph-edge: #30363d;
    --graph-edge-hover: #484f58;
    --graph-label: #e6edf3;
    --graph-label-muted: #8b949e;
    --graph-accent: #ff8a4c;
    --graph-info-bg: rgba(22, 27, 34, 0.85);
    --graph-info-border: #30363d;
    --graph-info-text: #e6edf3;
    --graph-empty-text: #8b949e;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--graph-bg);
  }

  body {
    font-family: -apple-system, "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #graph-svg {
    display: block;
    width: 100vw;
    height: 100vh;
    background-color: var(--graph-bg);
    cursor: grab;
  }

  #graph-svg.dragging {
    cursor: grabbing;
  }

  /* ---------- ノード / エッジ ---------- */

  .graph-edge {
    stroke: var(--graph-edge);
    stroke-width: 1.2px;
    fill: none;
  }

  .graph-edge.is-adjacent {
    stroke: var(--graph-accent);
    stroke-width: 1.8px;
  }

  .graph-node-circle {
    fill: var(--graph-node);
    stroke: var(--graph-node-stroke);
    stroke-width: 1.5px;
    cursor: pointer;
  }

  .graph-node-circle.is-hover {
    fill: var(--graph-node-hover);
  }

  .graph-node-circle.is-pinned {
    stroke-width: 3px;
  }

  .graph-node-label {
    fill: var(--graph-label);
    font-size: 11px;
    pointer-events: none;
    text-anchor: middle;
    user-select: none;
  }

  .graph-node-label.is-hover {
    fill: var(--graph-accent);
    font-weight: 600;
  }

  /* ---------- 情報バー ---------- */

  #graph-info {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    padding: 6px 12px;
    border: 1px solid var(--graph-info-border);
    border-radius: 6px;
    background: var(--graph-info-bg);
    color: var(--graph-info-text);
    font-size: 12px;
    line-height: 1.5;
    pointer-events: none;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }

  #graph-info .graph-info-folder {
    font-weight: 600;
  }

  #graph-info .graph-info-counts {
    color: var(--graph-label-muted);
  }

  /* ---------- 空状態 ---------- */

  #graph-empty {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    color: var(--graph-empty-text);
    font-size: 14px;
    text-align: center;
    display: none;
  }

  #graph-empty.visible {
    display: block;
  }
</style>
</head>
<body>

<div id="graph-info">
  <span class="graph-info-folder"></span>
  <span class="graph-info-counts"></span>
</div>

<div id="graph-empty">このフォルダに Markdown ファイルが見つかりません</div>

<svg id="graph-svg"></svg>

<script>window.__graphData = {{DATA}};</script>
<script src="https://assets.hirake/vendor/d3.v7.min.js"></script>
<script src="https://assets.hirake/graph.js" defer></script>
</body>
</html>
