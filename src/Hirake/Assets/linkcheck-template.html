<!DOCTYPE html>
<html lang="ja" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
  /* ---------------------------------------------------------
   * Hirake - linkcheck-template.html 用インラインスタイル
   * リンク切れ・孤立ページの検出ビュー専用。style.css は読み込まない。
   * 配色は CSS カスタムプロパティで定義し、ライト/ダークは
   * html[data-theme="dark"] で切替える（JS からは色を直接触らない）。
   * --------------------------------------------------------- */
  :root {
    /* ---- ライトテーマ（既定） ---- */
    --lc-bg: #ffffff;
    --lc-text: #1f2328;
    --lc-text-muted: #59636e;
    --lc-border: #d1d9e0;
    --lc-toolbar-bg: #f6f8fa;
    --lc-file-bg: #f6f8fa;
    --lc-item-hover: #eef2f6;
    --lc-accent: #0969da;
    --lc-line-badge: #59636e;
    --lc-warn-bg: #fff8c5;
    --lc-warn-text: #7d4e00;
    --lc-warn-border: #d4a72c;
    --lc-reason: #59636e;
    --lc-input-bg: #ffffff;
  }

  /* ---- ダークテーマ（GitHub Dark 風） ---- */
  html[data-theme="dark"] {
    --lc-bg: #0d1117;
    --lc-text: #e6edf3;
    --lc-text-muted: #8b949e;
    --lc-border: #30363d;
    --lc-toolbar-bg: #161b22;
    --lc-file-bg: #161b22;
    --lc-item-hover: #1f2630;
    --lc-accent: #58a6ff;
    --lc-line-badge: #8b949e;
    --lc-warn-bg: #272115;
    --lc-warn-text: #d29922;
    --lc-warn-border: #6c5416;
    --lc-reason: #8b949e;
    --lc-input-bg: #0d1117;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background-color: var(--lc-bg);
    color: var(--lc-text);
  }

  body {
    font-family: -apple-system, "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- ツールバー ---------- */

  #lc-toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--lc-toolbar-bg);
    border-bottom: 1px solid var(--lc-border);
  }

  #lc-toolbar label {
    color: var(--lc-text-muted);
    font-size: 12px;
  }

  #lc-toolbar select,
  #lc-toolbar button {
    padding: 4px 8px;
    border: 1px solid var(--lc-border);
    border-radius: 6px;
    background: var(--lc-input-bg);
    color: var(--lc-text);
    font-size: 13px;
    font-family: inherit;
  }

  #lc-toolbar button {
    cursor: pointer;
  }

  #lc-toolbar button:hover {
    background: var(--lc-item-hover);
  }

  #lc-exclude-label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  #lc-summary {
    margin-left: auto;
    color: var(--lc-text-muted);
    font-size: 12px;
  }

  .lc-hidden {
    display: none !important;
  }

  /* ---------- 走査範囲と注意書き ---------- */

  #lc-scope {
    padding: 6px 16px;
    color: var(--lc-text-muted);
    font-size: 12px;
    border-bottom: 1px solid var(--lc-border);
    overflow-wrap: anywhere;
  }

  #lc-notes {
    padding: 0 16px;
  }

  .lc-note {
    margin: 8px 0 0;
    padding: 6px 10px;
    background: var(--lc-warn-bg);
    color: var(--lc-warn-text);
    border: 1px solid var(--lc-warn-border);
    border-radius: 6px;
    font-size: 12px;
  }

  /* ---------- 結果一覧 ---------- */

  #lc-results {
    padding: 8px 16px 32px;
    max-width: 960px;
  }

  .lc-file {
    margin-top: 16px;
  }

  .lc-file-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 8px;
    background: var(--lc-file-bg);
    border: 1px solid var(--lc-border);
    border-radius: 6px;
    font-weight: 600;
    overflow-wrap: anywhere;
  }

  .lc-file-header .lc-file-count {
    margin-left: auto;
    color: var(--lc-text-muted);
    font-weight: 400;
    font-size: 12px;
    white-space: nowrap;
  }

  .lc-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .lc-item:hover {
    background: var(--lc-item-hover);
  }

  .lc-item:hover .lc-item-target {
    color: var(--lc-accent);
  }

  .lc-item-line {
    flex: none;
    min-width: 44px;
    color: var(--lc-line-badge);
    font-size: 12px;
    font-family: Consolas, monospace;
    text-align: right;
  }

  .lc-item-target {
    overflow-wrap: anywhere;
  }

  .lc-item-reason {
    margin-left: auto;
    flex: none;
    padding-left: 12px;
    color: var(--lc-reason);
    font-size: 12px;
    white-space: nowrap;
  }

  /* 孤立ページ（1 行 = 1 ファイル） */

  .lc-orphan {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .lc-orphan:hover {
    background: var(--lc-item-hover);
  }

  .lc-orphan:hover .lc-orphan-rel {
    color: var(--lc-accent);
  }

  .lc-orphan-rel {
    overflow-wrap: anywhere;
  }

  .lc-orphan-note {
    margin-left: auto;
    flex: none;
    padding-left: 12px;
    color: var(--lc-reason);
    font-size: 12px;
    white-space: nowrap;
  }

  /* ---------- 空状態 ---------- */

  #lc-empty {
    margin: 48px 16px;
    color: var(--lc-text-muted);
    font-size: 14px;
    text-align: center;
    display: none;
  }

  #lc-empty.visible {
    display: block;
  }
</style>
</head>
<body>

<div id="lc-toolbar">
  <label for="lc-mode">表示</label>
  <select id="lc-mode">
    <option value="broken" selected>リンク切れ</option>
    <option value="orphan">孤立ページ</option>
  </select>

  <label id="lc-exclude-label" for="lc-exclude">
    <input id="lc-exclude" type="checkbox" checked>
    index.md / README.md を孤立から除く
  </label>

  <button id="lc-copy" type="button">hirake:// 付きでコピー</button>

  <span id="lc-summary"></span>
</div>

<div id="lc-scope"></div>

<div id="lc-notes"></div>

<div id="lc-empty"></div>

<div id="lc-results"></div>

<script>window.__linkCheckData = {{DATA}};</script>
<script src="https://assets.hirake/linkcheck.js" defer></script>
</body>
</html>
